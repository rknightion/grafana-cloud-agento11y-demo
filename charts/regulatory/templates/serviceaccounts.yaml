{{- range $role := list "agents" "loadgen" "experiments" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index $.Values.serviceAccounts $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "regulatory.labels" $ | nindent 4 }}
# Pod Identity uses its own projected token; only experiments need the Kubernetes API token.
automountServiceAccountToken: {{ eq $role "experiments" }}
---
{{- end }}
