# Build and publish every image multi-arch to ghcr.io/<owner>/gc-agento11y-<name> (flat
# names: the shared container-publish reusable derives its uploaded artifact name from
# image-name and rejects a "/" in it) through the shared container-publish reusable. Edge builds
# on main; release_tag set for releases.
name: images

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/images.yml"]
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vX.Y.Z) to publish; empty = edge build"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agents, context: apps, dockerfile: agents/Dockerfile, trivy-ignore-file: apps/agents/.trivyignore.yaml }
          - { name: regulatory, context: apps, dockerfile: regulatory/Dockerfile, trivy-ignore-file: apps/regulatory/.trivyignore.yaml }
          - { name: site, context: apps, dockerfile: site/Dockerfile }
          - { name: site-browser, context: apps, dockerfile: site/Dockerfile.browser }
          - { name: mcp-tools, context: apps, dockerfile: mcp-tools/Dockerfile }
          - { name: gateway, context: apps/gateway, dockerfile: Dockerfile }
          - { name: dev-workstation, context: ".", dockerfile: apps/dev-workstation/Dockerfile }
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # The reusable resolves dockerfile relative to context.
    uses: rknightion/.github/.github/workflows/container-publish.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0
    with:
      release-tag: ${{ inputs.release_tag }}
      image-name: gc-agento11y-${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      # Keep failed scan findings visible in this public repository's Security tab.
      trivy-upload-sarif: true
      # Every image ignores HIGH/CRITICAL findings that have no fixed version yet; a finding with a
      # fix still fails the gate. Most of the unfixed ones are Debian bookworm OS packages in
      # site-browser (Playwright's), gateway (plain debian:bookworm-slim) and dev-workstation (apt).
      trivy-ignore-unfixed: true
      trivy-ignore-file: ${{ matrix.trivy-ignore-file || '' }}
      provenance: false
