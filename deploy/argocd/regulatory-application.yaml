# Argo CD Application for the Regulatory document authoring workloads (charts/regulatory).
#
# Terraform still owns the AWS and Grafana half and, in the cluster, the namespace, the Secrets and
# the Pod Identity association. Apply the module with deploy_workloads = false first, then replace
# the valuesObject below with the output of:
#
#   tofu -chdir=examples/complete output -raw chart_values_regulatory
#
# The values contain no secrets (the chart reads the Terraform-created Secrets by name), but they
# do contain your AWS account id in the inference profile ARNs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dossier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rknightion/grafana-cloud-agento11y-demo
    # Pin the same release tag as the Terraform module source.
    targetRevision: main
    path: charts/regulatory
    helm:
      releaseName: dossier
      valuesObject:
        # PASTE `terraform output -raw chart_values_regulatory` HERE, indented under valuesObject.
        # The keys below only show the shape.
        nameOverride: dossier
        namespace: dossier
        aws:
          region: eu-west-1
        agents:
          orchestrator:
            team: medical-writing
            modelProfileArn: REPLACE_WITH_TERRAFORM_OUTPUT
  destination:
    server: https://kubernetes.default.svc
    namespace: dossier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Terraform creates and owns the namespace.
      - CreateNamespace=false
